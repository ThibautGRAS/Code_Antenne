# ============================================================
# Session
# ============================================================
session_name: "test_live32"

# ============================================================
# Acquisition MU32
# ============================================================
Fe: 10000

Tw: 0.25      # fenêtre glissante en s (= mode Normal au démarrage)
Th: 0.05      # pas de mise à jour en s
overlap: 0.5   # recouvrement des trames du spectrogramme (0..0.95)
delta_f: 20.0

# Modes d'acquisition selectionnables dans l'UI : (Tw, Th, delta_f).
# delta_f adapte la fenetre FFT (nperseg = Fe/delta_f) pour garder un bon
# moyennage (>= 2 fenetres -> >= 3 trames) meme en mode rapide.
modes:
  - {label: "Lent",   Tw: 0.5,  Th: 0.1,  delta_f: 20}   # 10 fps - fenetre 0.5 s (~19 moy.), res 20 Hz, max moyennage
  - {label: "Normal", Tw: 0.25, Th: 0.05, delta_f: 20}   # 20 fps - fenetre 0.25 s (~9 moy.), res 20 Hz, equilibre
  - {label: "Rapide", Tw: 0.1,  Th: 0.05, delta_f: 40}   # 20 fps - fenetre 0.1 s (~7 moy.), reactif (transitoires), res 40 Hz

# ============================================================
# Fréquence live
# ============================================================
f_start: 2000.0
f_step: 100.0          # pas du clavier ( , / ; )
f_slider_step: 50.0    # pas du slider PySide (defaut = moitie de f_step)


f_min: 100.0
f_max_factor: 0.45

# ============================================================
# Beamforming
# ============================================================
diag_remove : False

obf_n_modes: 3

# ============================================================
# Fichiers
# ============================================================
geo_name: "32mu2.csv"
calib_name: "calib_camera.npz"

# ============================================================
# Grille beamforming angulaire
# ============================================================
Ltheta: 72
Lphi: 120

phi_min: 0.0
phi_max: 360.0

theta_margin_deg: 2.0
theta_max_limit_deg: 89.0

# ============================================================
# Caméra
# ============================================================
cam_index: 1
cam_w: 640
cam_h: 480

cam_offset: [0.0, 0.0, 0.00]
proj_distance_m: 1.0

flip_x: false
mirror_display: false

# ============================================================
# Rendu
# ============================================================
dyn_dB: 3.0
alpha_scale: 0.85
alpha_gamma: 0.85

show_hud: true
use_trackbar: false

# ============================================================
# Record
# ============================================================
record_fps: 0.0

# ============================================================
# Trigger niveau global
# ============================================================
enable_level_trigger: true
level_threshold_dB: 20.0
trig_max_dB: 120.0
trig_scale: 10

# =========================
# UI / dashboard
# =========================
ui_header_h: 56
ui_right_panel_w: 250
ui_bottom_bar_h: 54

ui_bg_color: [5, 28, 55]
ui_header_color: [0, 48, 85]
ui_panel_color: [8, 42, 78]
ui_panel_border_color: [80, 150, 200]

ui_text_color: [235, 240, 245]
ui_accent_color: [70, 190, 230]
ui_good_color: [120, 220, 90]
ui_alert_color: [255, 70, 70]

ui_colorbar_width_ratio: 0.52

ui_display_scale: 1.5

show_shortcuts_overlay: true
show_logo_cetim: true
cetim_logo_file: "logo-cetim.png"

# =========================
# Frequence live : borne basse commune au clavier et au slider.
# La borne haute = f_max (derive : f_max_factor * Fe), plafonnee a Fe/2.
# =========================
f_min_live: 500.0

# =========================
# Simulation (GUI PySide6) : repli auto si materiel absent
# =========================
force_sim_audio: false
force_sim_camera: false