[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "antennemu"
version = "0.1.0"
description = "Camera acoustique MU32 : beamforming temps reel (live) et post-traitement offline"
requires-python = ">=3.9"
authors = [{ name = "Thibaut Gras", email = "thibaut.gras@cetim.fr" }]

# Dependances d'execution (source UNIQUE du projet). PySide6 = interface Qt live,
# pyvista = visualisation mesh. Versions epinglees sur le venv.
dependencies = [
    "numpy==2.1.2",
    "scipy==1.14.1",
    "pandas==2.2.3",
    "opencv-python==4.10.0.84",
    "matplotlib==3.10.0",
    "plotly==5.24.1",
    "h5py==3.12.1",
    "PyQt5==5.15.11",
    "PySide6",
    "pyvista",
    "numpy-stl==3.1.2",
    "libusb1==3.1.0",
    "pydispatch==1.1.0",
    "python-dispatch==0.2.2",
    "PyYAML==6.0.2",
]

# Layout non standard : 'src' et 'data' sont EUX-MEMES des packages importables
# (from src..., from data.config import Config). On les expose tels quels, sans
# rien deplacer : `pip install -e .` rend ces imports valides depuis n'importe ou
# (et plus seulement depuis la racine du depot).
[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]
exclude = [
    "src.ldsfdatareader.build*",
    "src.ldsfdatareader.dist*",
    "src.ldsfdatareader.ldsfdatareader*",
    "src.megamicros.doc*",
]
